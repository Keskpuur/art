<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keskpuur – artist-run space at Keskturg, Tallinn</title>
<meta name="description" content="Keskpuur is an artist-run centre focusing on Keskturg (Central Market) and its surroundings. Keldrimäe 9, Tallinn.">
<meta property="og:title" content="Keskpuur">
<meta property="og:description" content="Artist-run centre at Keskturg, Tallinn. Now showing: Ellen Vene, Harvest.">
<meta property="og:image" content="https://keskpuur.com/2026/images/EllenVene.jpg">
<meta property="og:url" content="https://keskpuur.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#000;--mute:#666;--line:#d9d9d9;--open:#1f7a4d;--closed:#a33;--pad:clamp(1rem,3vw,2.5rem)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.05rem/1.55 Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* status bar */
.status{padding:.5rem var(--pad);border-bottom:1px solid var(--line);font-size:.9rem;color:var(--mute)}
.status b{font-weight:600;color:var(--closed)}
.status.is-open b{color:var(--open)}

/* header */
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.5rem 2rem;padding:var(--pad)}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;text-decoration:none}
nav{display:flex;gap:1.5rem}
nav a{text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}

/* current exhibition */
.hero{padding:0 var(--pad)}
.hero a.img{display:block;background:#eee}
.hero img{display:block;width:100%;height:auto;max-height:85vh;object-fit:cover}
.hero h1{margin:1.5rem 0 0;font-weight:800;font-size:clamp(3rem,14vw,14rem);line-height:.9;letter-spacing:-.04em}
.hero .show{margin:.3rem 0 0;font-weight:800;font-size:clamp(2.4rem,11vw,11rem);line-height:.95;letter-spacing:-.03em}.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem;margin:1rem 0 0;padding:1rem 0;border-top:2px solid var(--ink);font-size:1.25rem;font-weight:600}
.meta span:last-child{font-weight:400;color:var(--mute)}

/* info */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:2.5rem var(--pad);padding:4rem var(--pad)}
.info h2{margin:0 0 .75rem;font-size:1rem;font-weight:600}
.info p{margin:0 0 1rem;max-width:34rem}


footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;padding:var(--pad);font-size:.9rem;color:var(--mute)}
footer a{margin-right:1.25rem}
</style>
</head>
<body>

<div class="status" id="status" role="status">Keskpuur · 11:00–15:00 and by appointment</div>

<header>
  <a class="logo" href="index.html">Keskpuur</a>
  <nav aria-label="Main">
    <a href="current.html">Current</a>
    <a href="past.html">Past</a>
    <a href="About.html">About</a>
    <a href="#visit">Visit</a>
  </nav>
</header>


</script>
</body>
</html>
